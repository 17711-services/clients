[project]
name = "xyz17711"
version = "0.1.0"
description = "Core HTTP client (transport, auth, x402 payment, standardized error envelope) for the 17711.xyz microservice fleet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "pydantic>=2"]

# `pip install xyz17711[<service>]` installs ONLY this core package plus that one service's own
# generated client package -- never the whole fleet. Each entry here must point at a distribution
# published SEPARATELY (xyz17711-<service>) for this to be true "install a la carte", not a
# cosmetic grouping: pip extras only ever add dependencies, they can't subset a single package's
# own code. Regenerate this list (via generate.py) whenever a new service package is added -- see
# the top-level README.
#
# `payments` is a SEPARATE extra (not tied to any one service): pulls in `eth-account`, needed
# ONLY when constructing a `Client` with `x402_private_key` set to pay automatically past the free
# quota. A caller who never pays (stays within the free quota, or just wants the price surfaced
# via `PaymentRequiredError`) installs nothing extra -- `eth-account` is never a hard dependency.
[project.optional-dependencies]
ping = ["xyz17711-ping"]
proxy-pool = ["xyz17711-proxy-pool"]
web-scraper = ["xyz17711-web-scraper"]
websearch = ["xyz17711-websearch"]
emoji-match = ["xyz17711-emoji-match"]
ip-blocklist = ["xyz17711-ip-blocklist"]
catalog = ["xyz17711-catalog"]
address-risk = ["xyz17711-address-risk"]
company-check = ["xyz17711-company-check"]
company-profile = ["xyz17711-company-profile"]
contact-finder = ["xyz17711-contact-finder"]
domain-security = ["xyz17711-domain-security"]
extract-correct = ["xyz17711-extract-correct"]
sanctions-check = ["xyz17711-sanctions-check"]
token-verdict = ["xyz17711-token-verdict"]
url-extract = ["xyz17711-url-extract"]
payments = ["eth-account>=0.13"]
test = ["pytest>=8", "eth-account>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xyz17711_core"]
